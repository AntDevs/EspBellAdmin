<div class="icon-header">⚙</div>
<h2>Параметры системы</h2>

<form onsubmit="saveConfig(event)">
    <div class="form-group">
        <label for="cfg_boot_mode">Режим запуска при подаче питания:</label>
        <select id="cfg_boot_mode">
            <option value="music_first">Автономное проигрывание по питанию (Music First)</option>
            <option value="default">Только веб-сервер (без воспроизведения)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cfg_repeat_count">Количество повторов трека:</label>
        <input type="number" id="cfg_repeat_count" min="1" max="100" inputmode="numeric">
    </div>

    <div class="form-group">
        <label for="cfg_max_duration">Максимальная длительность проигрывания (сек, 0 = весь файл):</label>
        <input type="number" id="cfg_max_duration" min="0" max="86400" inputmode="numeric">
    </div>

    <div class="form-group">
        <label for="cfg_fade_out">Длительность плавного затухания Fade-Out (мс):</label>
        <input type="number" id="cfg_fade_out" min="0" max="10000" inputmode="numeric">
    </div>

    <div class="form-group">
        <label for="cfg_smart_timeout">Таймаут обесточивания в стартовом режиме (сек):</label>
        <input type="number" id="cfg_smart_timeout" min="1" max="86400" inputmode="numeric">
    </div>

    <div class="form-group">
        <label for="cfg_auth_smart_timeout">Таймаут обесточивания в режиме авторизации (сек):</label>
        <input type="number" id="cfg_auth_smart_timeout" min="1" max="86400" inputmode="numeric">
    </div>

    <div class="form-group">
        <label for="cfg_last_pos_sec">Секунда возобновления старта:</label>
        <input type="number" id="cfg_last_pos_sec" step="0.01" min="0" inputmode="decimal">
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="cfg_resume_playback">
        <label for="cfg_resume_playback" style="margin: 0;">Возобновлять воспроизведение с места остановки</label>
    </div>

    <div class="form-group">
        <label for="cfg_wifi_ssid">SSID Wi-Fi сети:</label>
        <input type="text" id="cfg_wifi_ssid" placeholder="Оставьте пустым для AP режима" autocomplete="off">
    </div>

    <div class="form-group">
        <label for="cfg_wifi_password">Пароль Wi-Fi сети:</label>
        <input type="password" id="cfg_wifi_password" placeholder="Пароль сети (если меняется)" autocomplete="new-password">
    </div>

    <div class="form-group">
        <label for="cfg_upload_password">Пароль авторизации веб-панели:</label>
        <input type="text" id="cfg_upload_password" required autocomplete="off">
    </div>

    <button type="submit" id="saveConfigBtn">Сохранить настройки</button>
    <button type="button" onclick="logout()" class="btn-secondary">Выйти</button>
</form>

<!-- aria-live: статус сохранения настроек теперь озвучивается скринридерами.
     Инлайн-стиль убран — margin-top/font-size/text-align/цвет/word-break
     теперь заданы единым правилом #configStatus в style.css. -->
<div id="configStatus" aria-live="polite"></div>
