<div class="icon-header">🔔</div>
<h2>Управление аудиофайлом</h2>

<!-- aria-live: обновление информации о памяти теперь озвучивается скринридерами -->
<div class="info-badge" id="diskInfo" aria-live="polite">
    Загрузка сведений о памяти...
</div>

<div class="form-group" style="border: 1px solid #cbd5e1; padding: 14px; border-radius: 8px; background-color: #f8fafc; margin-bottom: 18px;">
    <label style="margin-bottom: 8px;">Динамик ESP32 (I2S):</label>
    <button type="button" id="togglePlayBtn" onclick="toggleEsp32Audio()" style="background-color: #10b981; width: 100%;">▶ Проиграть</button>
</div>

<div class="form-group">
    <label for="fileInput">Выберите MP3/WAV (авто-конвертация в WAV <= 4 МБ):</label>
    <input type="file" id="fileInput" accept=".mp3,.wav" onchange="handleFileSelect(event)">
</div>

<div class="form-group" id="audioPreviewContainer" style="display: none;">
    <label id="previewLabel">Локальный предпросмотр (WAV):</label>
    <audio id="audioPreview" controls style="width: 100%; margin-top: 6px; border-radius: 8px; outline: none;"></audio>
</div>

<button type="button" id="uploadBtn" onclick="startUpload()">Конвертировать и загрузить на ESP32</button>
<button type="button" onclick="logout()" class="btn-secondary">Выйти</button>

<div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
</div>

<!-- aria-live: статус конвертации/загрузки файла теперь озвучивается скринридерами -->
<div id="status" aria-live="polite"></div>
