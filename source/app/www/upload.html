<div class="card">
    <div class="icon-header">🔔</div>
    <h2>Загрузка аудиофайла</h2>

    <div class="info-badge" id="diskInfo">
        Загрузка сведений о памяти...
    </div>

    <!-- Управление воспроизведением сохраненного файла на ESP32 -->
    <div class="form-group" style="border: 1px solid #cbd5e1; padding: 14px; border-radius: 8px; background-color: #f8fafc; margin-bottom: 18px;">
        <label style="margin-bottom: 8px;">Динамик ESP32 (I2S):</label>
        <div style="display: flex; gap: 8px;">
            <button type="button" onclick="playOnEsp32()" style="background-color: #10b981; flex: 1;">▶ Проиграть на ESP32</button>
            <button type="button" onclick="stopOnEsp32()" class="btn-secondary" style="margin-top: 0; flex: 1;">⏹ Стоп</button>
        </div>
    </div>

    <div class="form-group">
        <label for="fileInput">Выберите MP3/WAV (авто-конвертация в WAV <= 3 МБ):</label>
        <input type="file" id="fileInput" accept=".mp3,.wav" onchange="handleFileSelect(event)">
    </div>

    <!-- Предпросмотр локального конвертированного файла -->
    <div class="form-group" id="audioPreviewContainer" style="display: none;">
        <label id="previewLabel">Локальный предпросмотр (WAV):</label>
        <audio id="audioPreview" controls style="width: 100%; margin-top: 6px; border-radius: 8px; outline: none;"></audio>
    </div>

    <button onclick="startUpload()">Конвертировать и загрузить на ESP32</button>
    <button onclick="logout()" class="btn-secondary">Выйти</button>

    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div id="status"></div>
</div>
