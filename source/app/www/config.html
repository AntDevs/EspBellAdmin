<div class="card">
    <div style="display: flex; gap: 6px; margin-bottom: 20px;">
        <button onclick="loadView('upload.html')" class="btn-secondary" style="flex: 1; padding: 8px; font-size: 14px; margin-top: 0;">🎵 Аудио</button>
        <button onclick="loadView('config.html')" style="flex: 1; padding: 8px; font-size: 14px;">⚙ Настройки</button>
    </div>

    <div class="icon-header">⚙</div>
    <h2>Параметры config.json</h2>

    <form onsubmit="saveConfig(event)">
        <div class="form-group">
            <label for="cfg_boot_mode">Режим старта (boot_mode):</label>
            <select id="cfg_boot_mode" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1;">
                <option value="music_first">music_first (Сначала звук)</option>
                <option value="default">default (Обычный старт)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="cfg_repeat_count">Количество повторов (repeat_count):</label>
            <input type="number" id="cfg_repeat_count" min="1" max="100" required>
        </div>

        <div class="form-group">
            <label for="cfg_max_duration">Лимит времени воспроизведения (сек, 0=без лимита):</label>
            <input type="number" id="cfg_max_duration" min="0" required>
        </div>

        <div class="form-group">
            <label for="cfg_fade_out">Плавное затухание fade_out_ms (мс):</label>
            <input type="number" id="cfg_fade_out" min="0" step="100" required>
        </div>

        <div class="form-group">
            <label for="cfg_smart_timeout">Авто-выключение smart_timeout_sec (сек):</label>
            <input type="number" id="cfg_smart_timeout" min="1" required>
        </div>

        <div class="form-group">
            <label for="cfg_last_pos_sec">Позиция возобновления / старта (сек):</label>
            <input type="number" id="cfg_last_pos_sec" min="0" step="0.1" required>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="cfg_resume_playback" style="width: auto; margin: 0;">
            <label for="cfg_resume_playback" style="margin: 0; cursor: pointer;">Запоминать позицию остановки (resume_playback)</label>
        </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 18px 0;">

        <div class="form-group">
            <label for="cfg_wifi_ssid">Wi-Fi SSID (роутер):</label>
            <input type="text" id="cfg_wifi_ssid">
        </div>

        <div class="form-group">
            <label for="cfg_wifi_password">Wi-Fi Пароль:</label>
            <input type="password" id="cfg_wifi_password" placeholder="Оставьте пустым, если не меняется">
        </div>

        <div class="form-group">
            <label for="cfg_upload_password">Пароль веб-панели (upload_password):</label>
            <input type="password" id="cfg_upload_password" required>
        </div>

        <button type="submit">Сохранить настройки</button>
    </form>

    <div id="configStatus"></div>
</div>
